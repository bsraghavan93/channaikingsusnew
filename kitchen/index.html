<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitchen Display — Chennai Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="/kitchen/kitchen.css">
</head>
<body>

<!-- ── TOP BAR ── -->
<header id="kds-header">
  <div class="hdr-left">
    <span class="hdr-title"><i class="bi bi-fire"></i> Kitchen Display</span>
    <span class="hdr-sub">Chennai Kings</span>
  </div>
  <div class="hdr-right">
    <span id="hdr-clock" class="hdr-clock"></span>
    <span id="hdr-count" class="hdr-count">0 orders</span>
    <button id="sound-toggle" class="hdr-icon-btn" onclick="toggleSound()" title="Toggle sound">
      <i class="bi bi-bell-fill"></i>
    </button>
    <button class="hdr-icon-btn" onclick="refreshOrders()" title="Refresh">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>
</header>

<!-- ── EMPTY STATE ── -->
<div id="kds-empty" class="kds-empty" style="display:none">
  <i class="bi bi-check-circle-fill empty-icon"></i>
  <p class="empty-text">All caught up — no open orders</p>
</div>

<!-- ── ORDER CARDS ── -->
<div id="kds-board" class="kds-board"></div>

<!-- ── BUMP CONFIRMATION OVERLAY ── -->
<div id="bump-overlay" class="bump-overlay" style="display:none">
  <div class="bump-msg">
    <i class="bi bi-check-lg"></i>
    <span id="bump-table"></span> bumped
  </div>
</div>
