<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard — Chennai Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ── HEADER ── -->
<header class="admin-header">
  <a href="/main/" class="hdr-back"><i class="bi bi-arrow-left"></i></a>
  <div class="hdr-center">
    <img src="/assets/logo_full.png" alt="Chennai Kings" class="hdr-logo">
    <span class="hdr-badge">STAFF</span>
  </div>
  <button class="hdr-btn" onclick="refreshSessions()"><i class="bi bi-arrow-clockwise"></i></button>
</header>

<!-- ── PIN GATE ── -->
<div id="pin-gate" class="view-center">
  <i class="bi bi-shield-lock-fill big-icon gold"></i>
  <h2 class="view-title">Staff Access</h2>
  <p class="view-sub">Enter the staff PIN to continue</p>
  <div class="pin-row">
    <input id="pin-input" type="password" maxlength="6" placeholder="PIN" class="pin-input"
      onkeydown="if(event.key==='Enter')checkPin()">
    <button class="btn-gold" onclick="checkPin()">Enter</button>
  </div>
  <p id="pin-error" class="pin-error" style="display:none">Incorrect PIN</p>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard" style="display:none">

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat-card">
      <div id="stat-active" class="stat-num">0</div>
      <div class="stat-label">Active Tables</div>
    </div>
    <div class="stat-card">
      <div id="stat-available" class="stat-num">0</div>
      <div class="stat-label">Available</div>
    </div>
    <div class="stat-card">
      <div id="stat-revenue" class="stat-num">$0</div>
      <div class="stat-label">Open Orders</div>
    </div>
  </div>

  <!-- Table grid -->
  <div class="section-head">
    <h3 class="section-title">Table Status</h3>
    <button class="btn-sm" onclick="refreshSessions()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>
  <div id="table-grid" class="table-grid"></div>

  <!-- QR Codes section -->
  <div class="section-head mt3">
    <h3 class="section-title">QR Codes</h3>
    <button class="btn-sm" onclick="loadQRCodes()"><i class="bi bi-qr-code"></i> Generate</button>
  </div>
  <div id="qr-grid" class="qr-grid"></div>
  <div id="qr-actions" style="display:none" class="qr-actions">
    <button class="btn-gold" onclick="printQRCodes()"><i class="bi bi-printer"></i> Print All QR Codes</button>
  </div>
</div>

<!-- ── CLOSE TABLE CONFIRM MODAL ── -->
<div id="close-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeCloseModal()">
  <div class="modal-box">
    <h3 class="modal-title">Close Table <span id="close-table-name"></span>?</h3>
    <p class="modal-desc">This will close the Clover order and free the table. Make sure payment has been collected.</p>
    <div class="modal-btns">
      <button class="btn-outline" onclick="closeCloseModal()">Cancel</button>
      <button class="btn-gold" id="close-confirm-btn" onclick="confirmCloseTable()">Close Table</button>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
